<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rule of Three — 7.4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#141210;
  --surface:#1c1916;
  --surface2:#232019;
  --chalk:#f0ece3;
  --chalk2:#b8b2a7;
  --chalk3:#716b62;
  --blue:#6ba3d6;
  --amber:#e8a840;
  --green:#5dbf8a;
  --red:#e05a5a;
  --rule:#2e2a24;
  --display:'Playfair Display',Georgia,serif;
  --mono:'DM Mono',monospace;
  --body:'DM Sans',sans-serif;
}
html,body{background:var(--bg);color:var(--chalk)}
body{font-family:var(--body);min-height:100vh;-webkit-font-smoothing:antialiased;padding:0}

/* ── HEADER ── */
.header{padding:24px 28px 20px;border-bottom:1px solid var(--rule);
  display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.header-left{}
.chap-tag{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--chalk3);margin-bottom:8px}
.main-title{font-family:var(--display);font-size:clamp(34px,7vw,64px);font-weight:900;
  line-height:.95;color:var(--chalk);letter-spacing:-.01em}
.main-title em{font-style:italic;color:var(--amber)}
.subtitle{font-family:var(--mono);font-size:12px;color:var(--chalk3);margin-top:10px;line-height:1.6}
.mode-toggle{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.mode-btn{padding:8px 16px;border:1px solid var(--chalk3);background:transparent;
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--chalk3);cursor:pointer;transition:all .15s;white-space:nowrap}
.mode-btn.active.direct{border-color:var(--blue);color:var(--blue);background:#6ba3d610}
.mode-btn.active.inverse{border-color:var(--red);color:var(--red);background:#e05a5a10}
@media(max-width:580px){
  .header{grid-template-columns:1fr}
  .mode-toggle{flex-direction:row;align-items:flex-start}
}

/* ── SCENARIO STRIP ── */
.scenario-strip{background:var(--surface);border-bottom:1px solid var(--rule);padding:0}
.scenario-tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scenario-tabs::-webkit-scrollbar{display:none}
.stab{padding:12px 18px;border:none;border-bottom:2px solid transparent;background:transparent;
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--chalk3);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.stab.active{color:var(--chalk);border-bottom-color:var(--amber)}
.stab:hover:not(.active){color:var(--chalk2)}
.scenario-text{padding:16px 28px;font-size:14px;line-height:1.7;color:var(--chalk2);
  border-bottom:1px solid var(--rule);font-style:italic}
.scenario-text strong{color:var(--chalk);font-style:normal}

/* ── MAIN PROPORTION DISPLAY ── */
.prop-display{padding:28px;display:grid;grid-template-columns:1fr 80px 1fr;
  gap:0;align-items:center;border-bottom:1px solid var(--rule)}
.prop-col{display:flex;flex-direction:column;gap:12px}
.pc-head{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;opacity:.5}
.pc-head.c-blue{color:var(--blue)}
.pc-head.c-amber{color:var(--amber)}
.prop-pair{display:flex;flex-direction:column;gap:6px}
.pair-label{font-family:var(--mono);font-size:10px;color:var(--chalk3);text-transform:uppercase;letter-spacing:.08em}
.pair-val{font-family:var(--display);font-size:clamp(36px,6vw,58px);font-weight:900;
  line-height:1;color:var(--chalk)}
.pair-val.c-blue{color:var(--blue)}
.pair-val.c-amber{color:var(--amber)}
.pair-val.unknown{color:var(--amber);font-style:italic}
.pair-divider{width:100%;height:1.5px;background:var(--chalk3);opacity:.35;margin:4px 0}
.prop-sep{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.sep-sym{font-family:var(--display);font-size:clamp(28px,5vw,44px);color:var(--chalk3)}
.sep-line{width:1px;flex:1;background:var(--rule)}
@media(max-width:580px){
  .prop-display{grid-template-columns:1fr 48px 1fr;padding:20px 16px;gap:0}
  .pair-val{font-size:clamp(28px,9vw,48px)}
}

/* ── CROSS MULTIPLY BAND ── */
.cross-band{background:var(--surface);border-bottom:1px solid var(--rule);padding:22px 28px}
.cross-head{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--chalk3);margin-bottom:16px}
.cross-equation{font-family:var(--display);font-size:clamp(20px,4vw,32px);font-weight:700;
  line-height:1.4;color:var(--chalk);display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.ce-lhs{color:var(--blue)}
.ce-op{color:var(--chalk3);font-size:.8em}
.ce-rhs{color:var(--amber)}
.cross-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:320px;
  margin-top:16px;position:relative}
.cg-cell{padding:12px 16px;background:var(--surface2);border:1px solid var(--rule);
  font-family:var(--display);font-size:26px;font-weight:700;text-align:center;line-height:1}
.cg-cell.hl-blue{border-color:var(--blue);color:var(--blue);background:#6ba3d608}
.cg-cell.hl-amber{border-color:var(--amber);color:var(--amber);background:#e8a84008}
.cross-lines{position:absolute;inset:0;pointer-events:none}

/* ── FACTOR VIEW ── */
.factor-band{padding:18px 28px;border-bottom:1px solid var(--rule);
  display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:500px){.factor-band{grid-template-columns:1fr}}
.fb-block{background:var(--surface);border:1px solid var(--rule);padding:14px 16px}
.fb-label{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--chalk3);margin-bottom:8px}
.fb-eq{font-family:var(--mono);font-size:14px;font-weight:500;line-height:1.7;color:var(--chalk2)}
.fb-eq .hl{color:var(--chalk);font-weight:600}
.fb-eq .blu{color:var(--blue)}
.fb-eq .amb{color:var(--amber)}
.fb-eq .grn{color:var(--green)}

/* ── ANSWER ── */
.answer-band{padding:22px 28px;border-bottom:1px solid var(--rule);
  display:flex;align-items:baseline;gap:20px;flex-wrap:wrap}
.ans-label{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--chalk3)}
.ans-value{font-family:var(--display);font-size:clamp(42px,8vw,72px);font-weight:900;
  color:var(--green);line-height:1}
.ans-unit{font-family:var(--mono);font-size:16px;color:var(--chalk3);align-self:flex-end;padding-bottom:8px}
.ans-sentence{font-family:var(--mono);font-size:12px;color:var(--chalk2);
  align-self:flex-end;padding-bottom:10px;line-height:1.6}

/* ── INSIGHT ── */
.insight-band{padding:20px 28px;display:flex;gap:16px}
.insight-accent{width:3px;background:var(--amber);flex-shrink:0}
.insight-accent.warn{background:var(--red)}
.insight-body{font-size:13px;line-height:1.75;color:var(--chalk2)}
.insight-body strong{color:var(--chalk)}
.warn-box{padding:16px 20px;background:#e05a5a0a;border:1px solid #e05a5a30;
  font-size:13px;line-height:1.75;color:var(--chalk2)}
.warn-box strong{color:var(--red)}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="chap-tag">Ch. 7 · §7.4 · Proportion</div>
    <div class="main-title">Rule of <em>Three</em></div>
    <div class="subtitle">Three known · one missing · cross-multiply to solve</div>
  </div>
  <div class="mode-toggle">
    <button class="mode-btn active direct" data-mode="direct">Direct ↑↑</button>
    <button class="mode-btn inverse" data-mode="inverse">Inverse ↑↓ ⚠</button>
  </div>
</div>

<div class="scenario-strip">
  <div class="scenario-tabs" id="scenario-tabs"></div>
  <div class="scenario-text" id="scenario-text"></div>
</div>

<div class="prop-display" id="prop-display"></div>

<div class="cross-band" id="cross-band">
  <div class="cross-head">Cross multiplication</div>
  <div class="cross-equation" id="cross-eq"></div>
  <div class="cross-grid" id="cross-grid"></div>
</div>

<div class="factor-band" id="factor-band"></div>

<div class="answer-band" id="answer-band"></div>

<div class="insight-band" id="insight-band"></div>

<script>
const SCENARIOS={
  direct:[
    {label:'Lemonade',story:'Kesang adds <strong>10 spoons</strong> of sugar to <strong>6 glasses</strong> of lemonade. For <strong>18 glasses</strong> with the same sweetness, how many spoons does she need?',
      la:'Glasses',lb:'Spoons',a:6,b:10,c:18,unit:'spoons'},
    {label:'Car distance',story:'A car travels <strong>90 km</strong> in <strong>150 minutes</strong>. At the same speed, how far does it go in <strong>240 minutes</strong>?',
      la:'Time (min)',lb:'Distance (km)',a:150,b:90,c:240,unit:'km'},
    {label:'Midday meal',story:'The cook makes <strong>15 kg of rice</strong> for <strong>120 students</strong>. For <strong>80 students</strong>, how much rice is needed?',
      la:'Students',lb:'Rice (kg)',a:120,b:15,c:80,unit:'kg'},
    {label:'Bricks',story:'A <strong>10-ft wall</strong> takes <strong>1450 bricks</strong>. How many bricks for a <strong>108-ft wall</strong>?',
      la:'Wall (ft)',lb:'Bricks',a:10,b:1450,c:108,unit:'bricks'},
    {label:'Earth orbit',story:'Earth travels <strong>940 million km</strong> in a year (<strong>52 weeks</strong>). How far does it travel in just <strong>1 week</strong>?',
      la:'Weeks',lb:'Distance (M km)',a:52,b:940,c:1,unit:'M km'}
  ],
  inverse:[
    {label:'Speed vs time',story:"Puneeth's father covers Lucknow→Kanpur in <strong>2 hours at 50 km/h</strong>. How long would the same trip take at <strong>75 km/h</strong>?",
      la:'Speed (km/h)',lb:'Time (hrs)',a:50,b:2,c:75,unit:'hours'},
    {label:'Workers',story:'<strong>6 workers</strong> finish a job in <strong>10 days</strong>. The same job with <strong>15 workers</strong> — how many days?',
      la:'Workers',lb:'Days',a:6,b:10,c:15,unit:'days'},
    {label:'Tractor',story:'Oxen plough 1 acre in <strong>6 hours</strong>. A tractor is <strong>4× faster</strong>. How long for the tractor to plough the same acre?',
      la:'Speed factor',lb:'Hours/acre',a:1,b:6,c:4,unit:'hours'}
  ]
};

const state={mode:'direct',idx:0};

function fmt(n){return n%1===0?n:+n.toFixed(2);}

function getD(s){
  if(state.mode==='direct') return (s.b*s.c)/s.a;
  else return (s.a*s.b)/s.c;
}

function render(){
  const scens=SCENARIOS[state.mode];
  const s=scens[state.idx];
  const d=getD(s);

  // Tabs
  document.getElementById('scenario-tabs').innerHTML=scens.map((sc,i)=>
    `<button class="stab ${i===state.idx?'active':''}" data-i="${i}">${sc.label}</button>`
  ).join('');
  document.querySelectorAll('.stab').forEach(b=>{
    b.addEventListener('click',()=>{state.idx=+b.dataset.i;render();});
  });

  document.getElementById('scenario-text').innerHTML=s.story;

  // Prop display
  document.getElementById('prop-display').innerHTML=`
    <div class="prop-col">
      <div class="pc-head c-blue">${s.la}</div>
      <div class="prop-pair">
        <div class="pair-label">Known</div>
        <div class="pair-val c-blue">${s.a}</div>
        <div class="pair-divider"></div>
        <div class="pair-label">New</div>
        <div class="pair-val c-blue">${s.c}</div>
      </div>
    </div>
    <div class="prop-sep">
      <div class="sep-sym">∶</div>
      <div class="sep-line"></div>
      <div class="sep-sym">∷</div>
      <div class="sep-line"></div>
      <div class="sep-sym">∶</div>
    </div>
    <div class="prop-col">
      <div class="pc-head c-amber">${s.lb}</div>
      <div class="prop-pair">
        <div class="pair-label">Known</div>
        <div class="pair-val c-amber">${s.b}</div>
        <div class="pair-divider"></div>
        <div class="pair-label">Unknown</div>
        <div class="pair-val unknown">?</div>
      </div>
    </div>
  `;

  // Cross multiply
  let eqHTML,cg;
  if(state.mode==='direct'){
    eqHTML=`<span class="ce-lhs">${s.a} × ?</span><span class="ce-op">=</span><span class="ce-rhs">${s.b} × ${s.c}</span><span class="ce-op">→</span><span style="color:var(--green)">? = ${fmt(d)}</span>`;
    cg=`<div class="cg-cell hl-blue">${s.a}</div><div class="cg-cell hl-amber">${s.b}</div>
        <div class="cg-cell hl-blue">${s.c}</div><div class="cg-cell hl-amber">?</div>`;
  } else {
    eqHTML=`<span class="ce-lhs">${s.a} × ${s.b}</span><span class="ce-op">=</span><span class="ce-rhs">${s.c} × ?</span><span class="ce-op">→</span><span style="color:var(--green)">? = ${fmt(d)}</span>`;
    cg=`<div class="cg-cell hl-blue">${s.a}</div><div class="cg-cell hl-amber" style="border-color:var(--blue);color:var(--blue);background:#6ba3d608">${s.b}</div>
        <div class="cg-cell hl-amber">${s.c}</div><div class="cg-cell hl-amber">?</div>`;
  }
  document.getElementById('cross-eq').innerHTML=eqHTML;
  document.getElementById('cross-grid').innerHTML=cg;

  // Factor band
  if(state.mode==='direct'){
    const f=s.c/s.a;
    const fStr=fmt(f);
    document.getElementById('factor-band').innerHTML=`
      <div class="fb-block">
        <div class="fb-label">Scale factor</div>
        <div class="fb-eq"><span class="blu">${s.la}</span>: ${s.a} → ${s.c} <span class="hl">= ×${fStr}</span></div>
        <div class="fb-eq">Apply same to <span class="amb">${s.lb}</span>:</div>
        <div class="fb-eq">${s.b} × ${fStr} = <span class="grn">${fmt(d)}</span></div>
      </div>
      <div class="fb-block">
        <div class="fb-label">Verification</div>
        <div class="fb-eq">${s.a} / ${s.b} = ${fmt(s.a/s.b)}</div>
        <div class="fb-eq">${s.c} / ${fmt(d)} = ${fmt(s.c/d)}</div>
        <div class="fb-eq"><span class="grn hl">Equal ✓ — same ratio</span></div>
      </div>
    `;
  } else {
    const prod=s.a*s.b;
    document.getElementById('factor-band').innerHTML=`
      <div class="fb-block">
        <div class="fb-label">Product stays constant</div>
        <div class="fb-eq"><span class="blu">${s.a}</span> × <span class="amb">${s.b}</span> = <span class="hl">${prod}</span></div>
        <div class="fb-eq"><span class="blu">${s.c}</span> × <span class="amb">?</span> = <span class="hl">${prod}</span></div>
        <div class="fb-eq">? = ${prod} ÷ ${s.c} = <span class="grn">${fmt(d)}</span></div>
      </div>
      <div class="fb-block" style="border-color:var(--red)">
        <div class="fb-label" style="color:var(--red)">⚠ Not Rule of Three</div>
        <div class="fb-eq">Direct formula would give <span style="color:var(--red)">${fmt((s.b*s.c)/s.a)}</span></div>
        <div class="fb-eq" style="color:var(--chalk3)">— that's the wrong answer here.</div>
        <div class="fb-eq">Correct: product = k, so <span class="grn">${fmt(d)}</span></div>
      </div>
    `;
  }

  // Answer
  document.getElementById('answer-band').innerHTML=`
    <div class="ans-label">Answer</div>
    <div class="ans-value">${fmt(d)}</div>
    <div class="ans-unit">${s.unit}</div>
    <div class="ans-sentence">${s.c} ${s.la.toLowerCase()} ↔ ${fmt(d)} ${s.unit}</div>
  `;

  // Insight
  const ib=document.getElementById('insight-band');
  if(state.mode==='direct'){
    ib.innerHTML=`
      <div class="insight-accent"></div>
      <div class="insight-body"><strong>Direct proportion:</strong> when one quantity increases, the other increases by the same factor. The ratio stays constant. Cross-multiplication rule: <strong>a × d = b × c</strong>. Divide both sides to find the unknown.</div>
    `;
  } else {
    ib.innerHTML=`
      <div class="insight-accent warn"></div>
      <div class="warn-box"><strong>⚠ Inverse proportion — check before you calculate.</strong> More speed → less time. More workers → fewer days. One goes up, the other goes down. The relationship is <strong>a × b = c × d</strong> (constant product), not a:b :: c:d. Always ask: "if one increases, does the other increase or decrease?" before choosing your method.</div>
    `;
  }
}

document.querySelectorAll('.mode-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    state.mode=b.dataset.mode;
    state.idx=0;
    render();
  });
});

render();
</script>
</body>
</html>
